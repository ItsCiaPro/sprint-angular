<main>
    <div class="bg_image">
        <img src="img/ranger.png" width="100%" alt="ranger">
    </div>

    <div class="login_sidebar">
        <div class="logo">
            <img src="img/ford.png" alt="">
        </div>

        <div class="form_container">
            <h1>Boas-vindas</h1>

            <form class="login_form">

                <div class="input_container">
                    <div class="input_wrapper">
                        <img src="img/user_icon.svg" class="input_svg highlight" alt="">
                        <input type="text" class="emailInput formInput" name="nome" placeholder="Insira seu usuário"
                            required>
                    </div>

                    <img src="img/info_icon.svg" class="input_svg highlight" alt="information">
                </div>

                <div class="input_container">
                    <div class="input_wrapper">
                        <img src="img/password_lock_icon.svg" class="input_svg highlight" alt="">
                        <input type="password" class="passInput formInput" name="senha" placeholder="Insira sua senha"
                            required>

                        <!--Deixar funcional o botão de esconder a senha-->
                        <div class="hide_container">
                            <img [src]="currentPassIcon" (click)="AlternatePassVisibility()" class="input_svg pass_visi_button hidden" alt="">
                        </div>
                    </div>

                    <div class="input_white_space"></div>
                </div>

                <div class="auto_login_container">

                    <p>Logar automaticamente</p>

                    <label class="switch">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>

                    <img src="img/info_icon.svg" class="input_svg highlight" alt="information">
                </div>

                <div class="flex_row">
                    <button class="login_submit" disabled>Entrar</button>
                    <div class="input_white_space"></div>
                </div>
            </form>
        </div>

    </div>
</main>
