<main>
    <div class="bg_image">
        <img src="img/ranger.png" width="100%" alt="ranger">
    </div>

    <div class="login_sidebar">
        <div class="logo">
            <img src="img/ford.png" alt="">
        </div>

        <div class="form_container">
            <h1>Boas-vindas</h1>

            <form #loginForm="ngForm" class="login_form">

                <div class="input_container">
                    <div class="input_wrapper">
                        <img src="img/user_icon.svg" class="input_svg highlight" alt="">
                        <input #userInput type="text" class="formInput" name="nome" placeholder="Insira seu usuário"
                            [(ngModel)]="formloginModel.nome" required>
                    </div>

                    <img src="img/info_icon.svg" class="input_svg highlight" alt="information">
                </div>

                <div class="input_container">
                    <div class="input_wrapper">
                        <img src="img/password_lock_icon.svg" class="input_svg highlight" alt="">
                        <input #passInput [type]="isPassHidden ? 'password' : 'text'" (input)="0" class="formInput"
                            name="senha" placeholder="Insira sua senha" [(ngModel)]="formloginModel.senha" required>

                        <!--Deixar funcional o botão de esconder a senha-->
                        <div class="hide_container">
                            <img [src]="currentPassIcon" (click)="AlternatePassVisibility()"
                                class="input_svg pass_visi_button hidden" alt="">
                        </div>
                    </div>

                    <div class="input_white_space"></div>
                </div>

                <div class="auto_login_container">

                    <p>Logar automaticamente</p>

                    <label class="switch">
                        <input type="checkbox" name="logarAuto" [(ngModel)]="formloginModel.logarAuto" />
                        <span class="slider"></span>
                    </label>

                    <img src="img/info_icon.svg" class="input_svg highlight" alt="information">
                </div>

                <div class="flex_row">
                    <button class="login_submit" type="submit" (click)="onSubmit()"
                        [disabled]="!(userInput.value && passInput.value)">Entrar</button>
                    <div class="input_white_space"></div>
                </div>


            </form>

            @if (errorMessage !== '') {
            <div class="flex_row">
                <p class="error_message">{{ errorMessage }}</p>
                <div class="input_white_space"></div>
            </div>
            }
        </div>

    </div>
</main>
