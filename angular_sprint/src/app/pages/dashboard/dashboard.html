<app-navheader></app-navheader>

<main>

   <h1 class="dashboard_title">Dashboard FORD</h1>

   <div class="info_cards">

      <div class="card">
         <div class="card_title">
            <h1>Veículo</h1>
         </div>

         <div class="card_content">
            <select [(ngModel)]="currentCarChoice" (ngModelChange)="updateCards()">
               <option value="Ranger">Ranger</option>
               <option value="Mustang">Mustang</option>
               <option value="Territory">Territory</option>
               <option value="Bronco Sport">Bronco Sport</option>
            </select>
         </div>
      </div>

      <div class="card">
         <div class="card_title">
            <h1>Total de Vendas</h1>
         </div>

         <div class="card_content">
            <h1>{{ sellTotalAmount }}</h1>
            <h2>Unid.</h2>
         </div>
      </div>

      <div class="card">
         <div class="card_title">
            <h1>Conectados</h1>
         </div>

         <div class="card_content">
            <h1>{{ connectedAmount }}</h1>
            <h2>Unid.</h2>
         </div>
      </div>

      <div class="card">
         <div class="card_title">
            <h1>Update Software</h1>
         </div>

         <div class="card_content">
            <h1>{{ updateSoftwareAmount }}</h1>
            <h2>Unid.</h2>
         </div>
      </div>
   </div>

   @if (errorMessage !== '') {
   <div class="flex_row">
      <p class="error_message">{{ errorMessage }}</p>
      <div class="input_white_space"></div>
   </div>
   }

   <div class="car_image">
      <img [src]="carImage" width="100%" alt="">
   </div>

   <table>
      <tr>
         <th>Código - Vin</th>
         <th>Odômetro</th>
         <th>Nível de Combustível</th>
         <th>Status</th>
         <th>Lat.</th>
         <th>Long.</th>
      </tr>

      <tr>
         <td>
            <input type="text" name="vin" id="">
         </td>
         <td>?</td>
         <td>?</td>
         <td>?</td>
         <td>?</td>
         <td>?</td>
      </tr>

      <tr>
         <div></div>
      </tr>
   </table>

</main>
